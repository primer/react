name: Migration Status
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  merge-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: install dependencies
        run: npm ci
      - name: run migration script
        run: node script/merge-props-migration-status.mts >> $GITHUB_STEP_SUMMARY

  react-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run migration script
        run: node script/react-compiler-migration-status.mts >> $GITHUB_STEP_SUMMARY

  ts-docgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build doc-gen
        run: npm run build -w @primer/doc-gen
      - name: Run migration script
        run: node script/ts-docs-status.mts >> $GITHUB_STEP_SUMMARY
