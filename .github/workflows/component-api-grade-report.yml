name: Component API grade report

on:
  workflow_dispatch:
    inputs:
      audit_json:
        description: One component audit object or one-entry calculator data file (maximum 30,000 characters)
        required: true
        type: string
      scorecard_markdown:
        description: The matching rendered component scorecard (maximum 30,000 characters)
        required: true
        type: string

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Validate the grade and prepare artifact files
        run: node script/component-api-grade-report.mjs prepare
        env:
          COMPONENT_API_AUDIT_JSON: ${{ inputs.audit_json }}
          COMPONENT_API_SCORECARD_MARKDOWN: ${{ inputs.scorecard_markdown }}

      - name: Upload scorecard, audit data, and calculated summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-api-grade-${{ github.run_id }}
          path: ${{ runner.temp }}/component-api-grade-report/
          if-no-files-found: error
          retention-days: 90

      - name: Synchronize the issue hierarchy
        run: node script/component-api-grade-report.mjs sync
        env:
          COMPONENT_API_AUDIT_JSON: ${{ inputs.audit_json }}
          COMPONENT_API_SCORECARD_MARKDOWN: ${{ inputs.scorecard_markdown }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
