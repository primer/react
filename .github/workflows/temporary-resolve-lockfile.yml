name: Temporarily regenerate lockfile

on:
  push:
    branches:
      - adierkens-tailwind-base-ui-package

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
      - name: Remove inconsistent locked dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const {execFileSync} = require('node:child_process')
          const npmRoot = execFileSync('npm', ['root', '-g'], {encoding: 'utf8'}).trim()
          const Arborist = require(path.join(npmRoot, 'npm/node_modules/@npmcli/arborist'))
          ;(async () => {
            const tree = await new Arborist({path: process.cwd(), legacyPeerDeps: true}).loadVirtual()
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
            const locations = new Set()
            for (const node of tree.inventory.values()) {
              for (const edge of node.edgesOut.values()) {
                if (!edge.valid && !['peer', 'peerOptional', 'optional'].includes(edge.type) && edge.to) {
                  if (edge.to.isWorkspace) throw new Error(`Refusing to remove workspace ${edge.to.location}`)
                  locations.add(edge.to.location)
                }
              }
            }
            for (const location of locations) delete lock.packages[location]
            console.log('Removing inconsistent entries:', [...locations].join(', '))
            fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`)
          })().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - name: Regenerate and validate lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const path = require('node:path')
          const {execFileSync} = require('node:child_process')
          const npmRoot = execFileSync('npm', ['root', '-g'], {encoding: 'utf8'}).trim()
          const Arborist = require(path.join(npmRoot, 'npm/node_modules/@npmcli/arborist'))
          ;(async () => {
            const tree = await new Arborist({path: process.cwd(), legacyPeerDeps: true}).loadVirtual()
            const errors = []
            for (const node of tree.inventory.values()) {
              for (const edge of node.edgesOut.values()) {
                if (!edge.valid && !['peer', 'peerOptional', 'optional'].includes(edge.type)) {
                  errors.push(`${node.location}: ${edge.name}@${edge.spec} (${edge.error})`)
                }
              }
            }
            if (errors.length) throw new Error(errors.join('\n'))
            console.log('All required lockfile dependencies are valid')
          })().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
          if grep -nE '(pkgs\.visualstudio\.com|pkgs\.dev\.azure\.com|packagefeedproxy\.microsoft\.io)' package-lock.json; then
            echo 'Internal registry URL found in the generated lockfile'
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: regenerated-package-lock
          path: package-lock.json
