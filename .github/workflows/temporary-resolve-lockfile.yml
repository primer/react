name: Temporarily regenerate lockfile

on:
  push:
    branches:
      - adierkens-tailwind-base-ui-package

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
      - name: Regenerate and validate lockfile
        shell: bash
        run: |
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund \
            @babel/runtime @floating-ui/react-dom @floating-ui/utils enhanced-resolve jiti lightningcss \
            @emnapi/core @emnapi/runtime @emnapi/wasi-threads decimal.js js-tokens @jridgewell/gen-mapping csstype
          node <<'NODE'
          const path = require('node:path')
          const {execFileSync} = require('node:child_process')
          const npmRoot = execFileSync('npm', ['root', '-g'], {encoding: 'utf8'}).trim()
          const Arborist = require(path.join(npmRoot, 'npm/node_modules/@npmcli/arborist'))
          ;(async () => {
            const tree = await new Arborist({path: process.cwd(), legacyPeerDeps: true}).loadVirtual()
            const errors = []
            for (const node of tree.inventory.values()) {
              for (const edge of node.edgesOut.values()) {
                if (!edge.valid && !['peer', 'peerOptional', 'optional'].includes(edge.type)) {
                  errors.push(`${node.location}: ${edge.name}@${edge.spec} (${edge.error})`)
                }
              }
            }
            if (errors.length) throw new Error(errors.join('\n'))
            console.log('All required lockfile dependencies are valid')
          })().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
          if grep -nE '(pkgs\.visualstudio\.com|pkgs\.dev\.azure\.com|packagefeedproxy\.microsoft\.io)' package-lock.json; then
            echo 'Internal registry URL found in the generated lockfile'
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: regenerated-package-lock
          path: package-lock.json
