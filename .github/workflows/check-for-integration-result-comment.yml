name: Check for integration result comment

on:
  issue_comment:
    types: [created, edited]
  status:

permissions:
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: integration-result-${{ github.event.sha || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # note: this workflow always passes, it does not fail when integration tests are failing
  check-for-integration-result-comment:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'primer-integration[bot]') || (github.event_name == 'status' && startsWith(github.event.context, 'github-ui / ')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Update integration result labels
        uses: actions/github-script@5c56fde4671bc2d3592fb0f2c5b5bab9ddae03b1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const INTEGRATION_LABEL_NAMES = {
              // synced with https://github.com/primer/react/labels?q=integration-tests
              skipped: 'integration-tests: skipped manually',
              recommended: 'integration-tests: recommended',
              failing: 'integration-tests: failing',
              passing: 'integration-tests: passing'
            };

            const requiredContexts = ['github-ui / ci', 'github-ui / projects', 'github-ui / vrt'];
            const { owner, repo } = context.repo;
            const pullRequests = context.eventName === 'status'
              ? await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  owner, repo, commit_sha: context.payload.sha
                })
              : [(await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number })).data];

            for (const pullRequest of pullRequests) {
              const sha = context.eventName === 'status' ? context.payload.sha : pullRequest.head.sha;
              if (pullRequest.head.sha !== sha || pullRequest.state !== 'open') continue;

              const issue = { owner, repo, issue_number: pullRequest.number };
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, issue);
              const existingIntegrationLabels = labels
                .map(label => label.name)
                .filter(name => name.startsWith('integration-tests:'));
              if (existingIntegrationLabels.includes(INTEGRATION_LABEL_NAMES.skipped)) continue;

              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref: sha
              });
              const integrationStatuses = new Map();
              for (const status of statuses) {
                if (status.context.startsWith('github-ui / ') && !integrationStatuses.has(status.context)) {
                  integrationStatuses.set(status.context, status.state);
                }
              }

              if (requiredContexts.some(name => !integrationStatuses.has(name))) continue;

              const states = [...integrationStatuses.values()];
              const newIntegrationLabel = states.some(state => state === 'failure' || state === 'error')
                ? INTEGRATION_LABEL_NAMES.failing
                : states.every(state => state === 'success')
                  ? INTEGRATION_LABEL_NAMES.passing
                  : null;
              if (!newIntegrationLabel) continue;

              if (!existingIntegrationLabels.includes(newIntegrationLabel)) {
                await github.rest.issues.addLabels({ ...issue, labels: [newIntegrationLabel] });
              }
              for (const name of Object.values(INTEGRATION_LABEL_NAMES)) {
                if (name !== newIntegrationLabel && existingIntegrationLabels.includes(name)) {
                  try {
                    await github.rest.issues.removeLabel({ ...issue, name });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
              }
            }
